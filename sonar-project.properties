# SonarCloud analysis, run by .github/workflows/sonar.yml after both test suites.
sonar.projectKey=sametakbal_mq-viewer
sonar.organization=sametakbaldeveloper
sonar.projectName=mq-viewer

sonar.sources=src,sidecar/src/main/java,src-tauri/src
sonar.tests=src,sidecar/src/test/java
sonar.test.inclusions=src/**/*.test.ts,src/test/**,sidecar/src/test/java/**
sonar.exclusions=src/**/*.test.ts,src/test/**
sonar.sourceEncoding=UTF-8

# Coverage: Vitest (lcov) for the frontend, JaCoCo for the sidecar.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=sidecar/target/site/jacoco/jacoco.xml
sonar.java.source=21
sonar.java.binaries=sidecar/target/classes
sonar.java.test.binaries=sidecar/target/test-classes
sonar.java.libraries=${env.HOME}/.m2/repository/**/*.jar
sonar.java.test.libraries=${env.HOME}/.m2/repository/**/*.jar

# Only the logic layers are unit tested (React views, the browser mock, type declarations and the
# Rust shell are not), so they are left out of the coverage figure.
sonar.coverage.exclusions=src/components/**,src/App.tsx,src/main.tsx,src/lib/mock.ts,src/lib/types.ts,src-tauri/**

name: Tests & SonarCloud

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history for SonarCloud blame and new-code detection

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: sidecar/pom.xml

      - name: Install npm packages
        run: npm ci --ignore-scripts

      - name: Frontend tests with coverage
        run: npm run coverage

      - name: Typecheck
        run: npm run typecheck

      # `verify` runs the JUnit tests and fails the build below 90% JaCoCo coverage.
      - name: Sidecar tests with coverage
        working-directory: sidecar
        run: ./mvnw -B verify

      - name: SonarCloud scan
        # Fork PRs get no secrets; skip the scan there instead of failing.
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8
